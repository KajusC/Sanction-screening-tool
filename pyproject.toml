[project]
name = "sanctioncheck"
version = "0.1.0"
description = "Sanctions screening for suppliers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyascii>=0.3.3",
    "django>=6.1.3",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jellyfish>=1.3.0",
    "openai>=3.46.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pycountry>=26.2.16",
    "pydantic-settings>=2.16.2",
    "rapidfuzz>=3.14.6",
    "scalar-fastapi>=1.9.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
main = "sanction_check.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanction_check"]

[tool.ruff]
cache-dir = "~/.cache/ruff"
line-length = 120


select = [
    "ALL", # include all the rules, including new ones
]
ignore = [
    #### modules
    "ANN", # flake8-annotations
    "COM", # flake8-commas
    "C90", # mccabe complexity
    "DJ",  # django
    "EXE", # flake8-executable
    "T10", # debugger
    "TID", # flake8-tidy-imports

    #### specific rules
    "D100",   # ignore missing docs
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D200",
    "D205",
    "D212",
    "D400",
    "D401",
    "D415",
    "E402",   # false positives for local imports
    "E501",   # line too long
    "TRY003", # external messages in exceptions are too verbose
    "TD002",
    "TD003",
    "FIX002", # too verbose descriptions of todos
    "CPY001",
    "EM102"
]

[tool.ruff.lint.per-file-ignores]
"src/sanction_check/db/*" = ["RUF012"]
"scripts/*" = ["INP001"]

[tool.ruff.format]
skip-magic-trailing-comma = true
